<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖啡大炮商品表</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #1d1d1f; -webkit-font-smoothing: antialiased; }

/* 顶栏 — 毛玻璃效果 */
.header { background: rgba(255,255,255,0.72); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); color: #1d1d1f; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.header .search-box { display: flex; align-items: center; gap: 6px; }
.header input[type="text"] { padding: 8px 16px; border: none; border-radius: 10px; font-size: 14px; width: 220px; outline: none; background: rgba(0,0,0,0.04); color: #1d1d1f; transition: background 0.2s; }
.header input[type="text"]:focus { background: rgba(0,0,0,0.08); }
.header input[type="text"]::placeholder { color: #86868b; }

/* 主体 */
.container { display: flex; max-width: 1100px; margin: 20px auto 0; gap: 20px; padding: 0 20px; }

/* 左侧分类 — 圆角卡片 */
.sidebar { width: 200px; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 16px; flex-shrink: 0; padding: 16px 12px; border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 2px 12px rgba(0,0,0,0.04); align-self: flex-start; }
.sidebar h3 { padding: 4px 8px 12px; font-size: 11px; color: #86868b; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
.cat-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
.cat-list li { padding: 10px 14px; cursor: pointer; font-size: 13px; border-radius: 10px; transition: all 0.2s ease; position: relative; color: #6e6e73; user-select: none; font-weight: 500; }
.cat-list li:hover { background: rgba(0,0,0,0.04); color: #1d1d1f; }
.cat-list li.active { background: #1d1d1f; color: #fff; font-weight: 600; }
.cat-list li.active .count { color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.15); }
.cat-list li .count { float: right; color: #aeaeb2; font-size: 11px; background: rgba(0,0,0,0.04); padding: 2px 8px; border-radius: 10px; min-width: 22px; text-align: center; }

/* 右侧内容 */
.content { flex: 1; padding: 0; min-width: 0; }

/* 表格 — 圆角卡片容器 */
.table-wrapper { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.04); }
table { width: 100%; border-collapse: collapse; }
th { background: #f5f5f7; color: #6e6e73; padding: 11px 10px; text-align: center; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; border-bottom: 1px solid rgba(0,0,0,0.06); }
td { padding: 10px 10px; text-align: center; font-size: 13px; border-bottom: 1px solid rgba(0,0,0,0.04); color: #1d1d1f; }
tr:last-child td { border-bottom: none; }
tr:hover { background: #f5f5f7; }
tr.checked-row { background: #e8f5e9; }
td.name { text-align: left; font-weight: 500; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }

/* 数量加减按钮组 — 圆润胶囊风格 */
.qty-group { display: inline-flex; align-items: center; gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,0.1); background: #f5f5f7; }
.qty-btn { width: 30px; height: 30px; border: none; background: transparent; color: #1d1d1f; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; user-select: none; padding: 0; line-height: 1; font-weight: 400; }
.qty-btn:hover { background: rgba(0,0,0,0.06); }
.qty-btn:active { transform: scale(0.92); background: rgba(0,0,0,0.1); }
.qty-val { width: 42px; height: 30px; text-align: center; border: none; border-left: 1px solid rgba(0,0,0,0.1); border-right: 1px solid rgba(0,0,0,0.1); font-size: 14px; font-weight: 600; color: #1d1d1f; background: #fff; outline: none; padding: 0; }
.qty-val:focus { background: #fff; }
.checked-row .qty-group { border-color: #a5d6a7; }

/* 底部栏 — 毛玻璃 */
.footer { position: sticky; bottom: 0; background: rgba(255,255,255,0.8); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-top: 1px solid rgba(0,0,0,0.06); }
.summary { font-size: 17px; font-weight: 700; color: #1d1d1f; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

/* 按钮 — 圆润胶囊 */
.btn { padding: 9px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s ease; letter-spacing: -0.1px; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: #1d1d1f; color: #fff; }
.btn-primary:hover { background: #3a3a3c; }
.btn-success { background: #34c759; color: #fff; }
.btn-success:hover { background: #30b350; }
.btn-danger { background: #ff3b30; color: #fff; }
.btn-danger:hover { background: #e0352b; }
.btn-warning { background: #ff9500; color: #fff; }
.btn-warning:hover { background: #e68600; }
.btn-info { background: #007aff; color: #fff; }
.btn-info:hover { background: #0066d6; }
.btn-default { background: rgba(0,0,0,0.06); color: #1d1d1f; }
.btn-default:hover { background: rgba(0,0,0,0.1); }
.btn-ghost { background: transparent; color: #86868b; border: 1px solid rgba(0,0,0,0.12); }
.btn-ghost:hover { background: rgba(0,0,0,0.04); color: #1d1d1f; }
.btn-save { background: #1d1d1f; color: #fff; }
.btn-save:hover { background: #3a3a3c; }

/* iOS 风格底部按钮 */
.btn-ios { padding: 12px 24px; border: none; border-radius: 14px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s ease; letter-spacing: -0.1px; background: #007aff; color: #fff; }
.btn-ios:active { transform: scale(0.96); opacity: 0.8; }
.btn-ios-gray { background: rgba(0,0,0,0.06); color: #1d1d1f; }
.btn-ios-gray:active { background: rgba(0,0,0,0.12); }
.btn-ios-blue { background: #007aff; color: #fff; }
.btn-ios-blue:active { background: #0066d6; }
.btn-ios-red { background: #ff3b30; color: #fff; }
.btn-ios-red:active { background: #e0352b; }
.btn-ios-green { background: #34c759; color: #fff; }
.btn-ios-green:active { background: #30b350; }

/* 表格工具栏 */
.table-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.table-toolbar .toolbar-title { font-size: 15px; font-weight: 700; color: #1d1d1f; }
.table-toolbar .toolbar-actions { display: flex; gap: 8px; }

/* 模态框 */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 999; justify-content: center; align-items: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 20px; padding: 32px; width: 420px; max-width: 90vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
.modal h2 { margin-bottom: 20px; font-size: 20px; color: #1d1d1f; font-weight: 700; letter-spacing: -0.3px; }
.modal .form-group { margin-bottom: 16px; }
.modal label { display: block; margin-bottom: 6px; font-size: 12px; color: #86868b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.modal input, .modal select { width: 100%; padding: 10px 14px; border: 1px solid rgba(0,0,0,0.1); border-radius: 10px; font-size: 14px; background: #f5f5f7; color: #1d1d1f; transition: all 0.2s; }
.modal input:focus, .modal select:focus { border-color: #007aff; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.12); }
.modal .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

/* 提示 */
.toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; padding: 12px 28px; border-radius: 12px; font-size: 14px; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-weight: 500; }
.toast.show { opacity: 1; }

/* 地址栏 — 圆角卡片 */
.addr-bar { background: #fff; border-radius: 16px; padding: 16px 20px; display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; max-width: 1100px; margin: 20px auto 0; box-shadow: 0 2px 12px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.04); }
.addr-bar label { font-size: 14px; font-weight: 600; color: #1d1d1f; white-space: nowrap; padding-top: 10px; }
.addr-bar textarea { flex: 1; min-width: 260px; min-height: 60px; padding: 10px 14px; border: 1px solid rgba(0,0,0,0.1); border-radius: 10px; font-size: 14px; resize: vertical; font-family: inherit; background: #f5f5f7; transition: all 0.2s; }
.addr-bar textarea:focus { border-color: #007aff; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.12); }
.addr-bar textarea::placeholder { color: #aeaeb2; }
.addr-bar .addr-hint { font-size: 12px; color: #aeaeb2; width: 100%; }

/* 空状态 */
.empty { text-align: center; padding: 60px 40px; color: #aeaeb2; font-size: 14px; }

/* 今日保存记录面板 */
.record-panel { display: none; position: fixed; bottom: 80px; right: 20px; background: rgba(255,255,255,0.95); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); padding: 20px; width: 380px; max-width: 94vw; z-index: 999; max-height: 500px; overflow-y: auto; border: 1px solid rgba(0,0,0,0.06); }
.record-panel.show { display: block; }
.record-panel h3 { font-size: 16px; color: #1d1d1f; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
.record-panel h3 .close-btn { cursor: pointer; font-size: 20px; color: #aeaeb2; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.2s; }
.record-panel h3 .close-btn:hover { background: rgba(0,0,0,0.06); color: #1d1d1f; }
.record-panel .record-empty { text-align: center; color: #aeaeb2; padding: 20px 0; font-size: 13px; }
.record-panel .record-date { font-size: 11px; color: #aeaeb2; margin-bottom: 12px; font-weight: 500; }
.record-badge { position: absolute; top: -6px; right: -6px; background: #ff3b30; color: #fff; border-radius: 10px; padding: 1px 6px; font-size: 11px; min-width: 18px; text-align: center; font-weight: 600; }
.btn-record { position: relative; }

/* 订单卡片 */
.order-card { border: 1px solid rgba(0,0,0,0.06); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.order-card .order-header { background: #f5f5f7; padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-radius: 12px 12px 0 0; }
.order-card:not(.open) .order-header { border-radius: 12px; }
.order-card .order-header:hover { background: rgba(0,0,0,0.04); }
.order-card .order-addr { font-size: 13px; color: #1d1d1f; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; font-weight: 500; }
.order-card .order-summary { font-size: 12px; color: #ff3b30; font-weight: 700; white-space: nowrap; }
.order-card .order-body { display: none; padding: 0; }
.order-card.open .order-body { display: block; }
.order-card .order-body table { width: 100%; border-collapse: collapse; font-size: 12px; }
.order-card .order-body th { background: #f5f5f7; padding: 8px 10px; text-align: center; color: #86868b; font-size: 11px; font-weight: 600; text-transform: uppercase; }
.order-card .order-body td { padding: 7px 10px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.04); color: #1d1d1f; }
.order-card .order-body td.name { text-align: left; font-weight: 500; }
.order-card .order-body td.num { text-align: right; }
.order-card .order-time { font-size: 11px; color: #aeaeb2; padding: 8px 16px; }
.order-card .order-actions { padding: 8px 16px 12px; display: flex; gap: 8px; }
.order-card .order-actions .btn { padding: 5px 12px; font-size: 11px; }

/* 分类发货单弹窗 */
.split-modal { background: #fff; border-radius: 20px; padding: 28px; width: 600px; max-width: 92vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
.split-modal h2 { margin-bottom: 4px; font-size: 20px; color: #1d1d1f; font-weight: 700; letter-spacing: -0.3px; }
.split-modal .split-desc { font-size: 13px; color: #86868b; margin-bottom: 20px; }
.split-card { border: 1px solid rgba(0,0,0,0.06); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
.split-card .split-header { background: #f5f5f7; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-radius: 14px 14px 0 0; }
.split-card:not(.open) .split-header { border-radius: 14px; }
.split-card .split-header h3 { font-size: 15px; color: #1d1d1f; font-weight: 700; }
.split-card .split-header .split-info { font-size: 13px; color: #ff3b30; font-weight: 700; }
.split-card .split-body { padding: 0; display: none; }
.split-card.open .split-body { display: block; }
.split-card .split-toggle { font-size: 12px; color: #aeaeb2; transition: transform 0.2s; }
.split-card.open .split-toggle { transform: rotate(180deg); }
.split-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.split-table th { background: #f5f5f7; padding: 10px 12px; text-align: center; color: #86868b; font-size: 12px; font-weight: 600; text-transform: uppercase; }
.split-table td { padding: 9px 12px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.04); color: #1d1d1f; }
.split-table td.name { text-align: left; font-weight: 500; }
.split-table td.num { text-align: right; }
.split-card .split-actions { padding: 12px 16px; background: #f5f5f7; display: flex; gap: 8px; flex-wrap: wrap; }
.split-card .split-actions .btn { padding: 7px 14px; font-size: 12px; }
.split-empty { text-align: center; padding: 40px; color: #aeaeb2; font-size: 14px; }

/* 响应式 */
@media (max-width: 768px) {
  .container { flex-direction: column; padding: 0 12px; margin-top: 12px; gap: 12px; }
  .sidebar { width: 100%; border-radius: 14px; padding: 10px; }
  .sidebar h3 { padding: 4px 6px 8px; }
  .cat-list { display: flex; flex-wrap: wrap; gap: 4px; padding: 0; }
  .cat-list li { border-radius: 8px; padding: 8px 14px; font-size: 12px; }
  .header { padding: 12px 16px; }
  .header input[type="text"] { width: 140px; }
  th, td { font-size: 12px; padding: 8px 6px; }
  .footer { padding: 10px 16px; }
  .qty-btn { width: 26px; height: 26px; font-size: 14px; }
  .qty-val { width: 34px; height: 26px; font-size: 12px; }
  .summary { font-size: 15px; }
  .btn { padding: 8px 14px; font-size: 12px; }
  .addr-bar { margin: 12px 12px 0; border-radius: 14px; padding: 14px; }
  .table-wrapper { border-radius: 14px; }
}
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="header">
  <h1 id="shopName">咖啡大炮商品表</h1>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索商品名..." oninput="onSearch()">
  </div>
</div>

<!-- 地址栏 -->
<div class="addr-bar">
  <label>📍 收货地址:</label>
  <textarea id="addressInput" placeholder="输入收货人姓名、电话、地址（如：张三 138xxxx 北京市朝阳区xxx路xx号）" oninput="saveAddress()" rows="2"></textarea>
  <button class="btn btn-ghost" onclick="clearAddress()" style="padding:8px 12px; font-size:13px;">清空地址</button>
  <span class="addr-hint" id="addrStatus">输入地址自动确认 → 点+号选商品</span>
</div>

<!-- 主体 -->
<div class="container">
  <!-- 左侧分类 -->
  <div class="sidebar">
    <h3>商品分类</h3>
    <ul class="cat-list" id="catList"></ul>
  </div>
  <!-- 右侧表格 -->
  <div class="content">
    <div class="table-toolbar">
      <span class="toolbar-title">商品列表</span>
      <div class="toolbar-actions">
        <button class="btn btn-ghost" onclick="clearAll()">清空</button>
      </div>
    </div>
    <div class="table-wrapper">
    <table id="productTable">
      <thead>
        <tr>
          <th>商品名称</th>
          <th>规格</th>
          <th>单位</th>
          <th>单价(¥)</th>
          <th style="width:110px;">数量</th>
          <th>小计(¥)</th>
          <th style="width:50px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    </div>
    <div id="emptyHint" class="empty" style="display:none;">没有匹配的商品</div>
  </div>
</div>

<!-- 底部栏 -->
<div class="footer">
  <div class="summary" id="summary">已选: 0种  合计: ¥0.00</div>
  <div class="btn-group">
    <button class="btn btn-ios" onclick="openAddModal()">➕ 新增商品</button>
    <button class="btn btn-ios btn-ios-gray" onclick="selectAll()">全选</button>
    <button class="btn btn-ios btn-ios-gray" onclick="exportCSV()">导出CSV</button>
    <button class="btn btn-ios btn-ios-gray" onclick="printList()">打印清单</button>
    <button class="btn btn-ios btn-ios-blue" onclick="openSplitModal('sell')">📋 客户版发货单</button>
    <button class="btn btn-ios btn-ios-red" onclick="openSplitModal('cost')">📦 发货版发货单</button>
  </div>
</div>

<!-- 新增商品模态框 -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>新增商品</h2>
    <div class="form-group">
      <label>分类 *</label>
      <select id="addCat" onchange="onCatChange()"></select>
    </div>
    <div class="form-group" id="newCatGroup" style="display:none;">
      <label>新分类名称</label>
      <input type="text" id="newCatName" placeholder="输入新分类名">
    </div>
    <div class="form-group">
      <label>商品名称 *</label>
      <input type="text" id="addName" placeholder="商品名称">
    </div>
    <div class="form-group">
      <label>规格</label>
      <input type="text" id="addSpec" placeholder="如 500g/袋">
    </div>
    <div class="form-group">
      <label>单位</label>
      <input type="text" id="addUnit" placeholder="如 袋、瓶、包">
    </div>
    <div class="form-group">
      <label>单价(¥) *</label>
      <input type="number" id="addPrice" placeholder="售价 0.00" step="0.01" min="0">
    </div>
    <div class="form-group">
      <label>成本价(¥)</label>
      <input type="number" id="addCost" placeholder="成本 0.00（可选）" step="0.01" min="0">
    </div>
    <div class="modal-btns">
      <button class="btn btn-default" onclick="closeAddModal()">取消</button>
      <button class="btn btn-success" onclick="confirmAdd()">添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 分类发货单弹窗 -->
<div class="modal-overlay" id="splitModal">
  <div class="split-modal">
    <h2>📋 分类发货单</h2>
    <div class="split-desc">已勾选的商品按分类自动拆分为独立发货单，可分别复制或导出。</div>
    <div id="splitContent"></div>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px;">
      <button class="btn btn-default" onclick="closeSplitModal()">关闭</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 初始数据
// ============================================================
const INITIAL_DATA = {
  "shop_name": "咖啡大炮商品表",
  "categories": [
    {"name": "咖啡大炮咖啡豆", "products": [
      {"name": "咖啡豆", "spec": "500g/袋", "unit": "袋", "price": 55.0, "cost": 42.0}
    ]},
    {"name": "风味糖浆", "products": [
      {"name": "香草风味糖浆", "spec": "850ml/瓶", "unit": "瓶", "price": 50.0, "cost": 28.0},
      {"name": "榛果风味糖浆", "spec": "850ml/瓶", "unit": "瓶", "price": 50.0, "cost": 28.0},

const STORAGE_KEY = "kanhuo_data_v1";

// ============================================================
// 状态
// ============================================================
let shopName = "";
let categories = [];
let currentCat = "全部商品";
let searchKw = "";
// items: 扁平化商品列表，每项含 cat/name/spec/unit/price/qty/checked
let allItems = [];

// ============================================================
// 数据加载 & 保存
// ============================================================
function loadData() {
  // 优先从 localStorage 读取，否则用初始数据
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const d = JSON.parse(saved);
      shopName = d.shop_name || "咖啡大炮";
      categories = d.categories || [];
      return;
    } catch(e) {}
  }
  shopName = INITIAL_DATA.shop_name;
  categories = JSON.parse(JSON.stringify(INITIAL_DATA.categories));
}

function saveData() {
  const data = { shop_name: shopName, categories: categories };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function resetData() {
  localStorage.removeItem(STORAGE_KEY);
  shopName = INITIAL_DATA.shop_name;
  categories = JSON.parse(JSON.stringify(INITIAL_DATA.categories));
  flattenItems();
  rebuildCatList();
  refreshTable();
}

// ============================================================
// 扁平化
// ============================================================
function flattenItems() {
  allItems = [];
  categories.forEach(cat => {
    cat.products.forEach(p => {
      allItems.push({
        cat: cat.name,
        name: p.name,
        spec: p.spec || "",
        unit: p.unit || "",
        price: parseFloat(p.price) || 0,
        cost: parseFloat(p.cost) || 0,
        qty: 0,
        checked: false
      });
    });
  });
}

// ============================================================
// 渲染：分类列表
// ============================================================
function rebuildCatList() {
  const ul = document.getElementById("catList");
  ul.innerHTML = "";
  // 全部商品
  const total = allItems.length;
  const liAll = document.createElement("li");
  liAll.className = currentCat === "全部商品" ? "active" : "";
  liAll.innerHTML = `全部商品 <span class="count">${total}</span>`;
  liAll.onclick = () => { currentCat = "全部商品"; rebuildCatList(); refreshTable(); };
  ul.appendChild(liAll);
  // 各分类
  categories.forEach(cat => {
    const li = document.createElement("li");
    li.className = currentCat === cat.name ? "active" : "";
    li.innerHTML = `${escHtml(cat.name)} <span class="count">${cat.products.length}</span>`;
    li.onclick = () => { currentCat = cat.name; rebuildCatList(); refreshTable(); };
    ul.appendChild(li);
  });
}

// ============================================================
// 渲染：表格
// ============================================================
function getFiltered() {
  const kw = searchKw.trim().toLowerCase();
  return allItems.filter(item => {
    if (currentCat !== "全部商品" && item.cat !== currentCat) return false;
    if (kw && !item.name.toLowerCase().includes(kw)) return false;
    return true;
  });
}

function refreshTable() {
  const tbody = document.getElementById("tableBody");
  const empty = document.getElementById("emptyHint");
  tbody.innerHTML = "";
  const items = getFiltered();
  if (items.length === 0) {
    empty.style.display = "block";
    document.getElementById("productTable").style.display = "none";
  } else {
    empty.style.display = "none";
    document.getElementById("productTable").style.display = "";
  }

  items.forEach((item, idx) => {
    const tr = document.createElement("tr");
    if (item.checked) tr.className = "checked-row";

    // 名称
    const tdName = document.createElement("td");
    tdName.className = "name";
    tdName.textContent = item.name;
    tr.appendChild(tdName);

    // 规格
    const tdSpec = document.createElement("td");
    tdSpec.textContent = item.spec;
    tr.appendChild(tdSpec);

    // 单位
    const tdUnit = document.createElement("td");
    tdUnit.textContent = item.unit;
    tr.appendChild(tdUnit);

    // 单价
    const tdPrice = document.createElement("td");
    tdPrice.className = "num";
    tdPrice.textContent = item.price.toFixed(2);
    tr.appendChild(tdPrice);

    // 数量（加减按钮组）
    const tdQty = document.createElement("td");
    const qtyGroup = document.createElement("div");
    qtyGroup.className = "qty-group";

    const btnMinus = document.createElement("button");
    btnMinus.className = "qty-btn";
    btnMinus.textContent = "−";
    btnMinus.onclick = (e) => {
      e.preventDefault();
      if (item.qty > 0) { item.qty--; }
      if (item.qty === 0) item.checked = false;
      syncQtyUI();
    };

    const qtyVal = document.createElement("input");
    qtyVal.type = "text";
    qtyVal.className = "qty-val";
    qtyVal.value = item.qty > 0 ? item.qty : "";
    qtyVal.oninput = () => {
      const v = parseInt(qtyVal.value) || 0;
      item.qty = Math.max(0, v);
      if (item.qty > 0) item.checked = true; else item.checked = false;
      syncQtyUI();
    };

    const btnPlus = document.createElement("button");
    btnPlus.className = "qty-btn";
    btnPlus.textContent = "+";
    btnPlus.onclick = (e) => {
      e.preventDefault();
      item.qty++;
      item.checked = true;
      syncQtyUI();
    };

    function syncQtyUI() {
      qtyVal.value = item.qty > 0 ? item.qty : "";
      tdSub.textContent = item.qty > 0 ? (item.price * item.qty).toFixed(2) : "";
      if (item.checked && item.qty > 0) { tr.className = "checked-row"; }
      else { tr.className = ""; }
      updateSummary();
    }

    qtyGroup.appendChild(btnMinus);
    qtyGroup.appendChild(qtyVal);
    qtyGroup.appendChild(btnPlus);
    tdQty.appendChild(qtyGroup);
    tr.appendChild(tdQty);

    // 小计
    const tdSub = document.createElement("td");
    tdSub.className = "num";
    tdSub.textContent = item.qty > 0 ? (item.price * item.qty).toFixed(2) : "";
    tr.appendChild(tdSub);

    // 操作（删除）
    const tdDel = document.createElement("td");
    const delBtn = document.createElement("span");
    delBtn.textContent = "🗑";
    delBtn.style.cursor = "pointer";
    delBtn.title = "删除此商品";
    delBtn.onclick = () => deleteProduct(item);
    tdDel.appendChild(delBtn);
    tr.appendChild(tdDel);

    tbody.appendChild(tr);
  });

  updateSummary();
}

function updateSubtotal(td, item) {
  td.textContent = item.qty > 0 ? (item.price * item.qty).toFixed(2) : "";
}

// ============================================================
// 统计
// ============================================================
function updateSummary() {
  let count = 0, total = 0, totalQty = 0;
  allItems.forEach(item => {
    if (item.checked && item.qty > 0) {
      count++;
      total += item.price * item.qty;
      totalQty += item.qty;
    }
  });
  document.getElementById("summary").textContent =
    `已选: ${count}种  共${totalQty}件  合计: ¥${total.toFixed(2)}`;
}

// 地址保存 & 加载
// ============================================================
const ADDR_KEY = "kanhuo_address";

function saveAddress() {
  const addr = document.getElementById("addressInput").value;
  localStorage.setItem(ADDR_KEY, addr);
}

function loadAddress() {
  const addr = localStorage.getItem(ADDR_KEY) || "";
  document.getElementById("addressInput").value = addr;
}

function getAddress() {
  return document.getElementById("addressInput").value.trim();
}

function clearAddress() {
  document.getElementById("addressInput").value = "";
  localStorage.removeItem(ADDR_KEY);
  document.getElementById("addrStatus").textContent = "输入地址 → 点+号选商品 → 点确认保存";
  showToast("地址已清空");
}

// ============================================================
// 搜索
// ============================================================
function onSearch() {
  searchKw = document.getElementById("searchInput").value;
  refreshTable();
}

// ============================================================
// 批量操作
// ============================================================
function selectAll() {
  getFiltered().forEach(item => {
    item.checked = true;
    if (item.qty === 0) item.qty = 1;
  });
  refreshTable();
  showToast("已全选当前列表");
}

function clearAll() {
  allItems.forEach(item => { item.checked = false; item.qty = 0; });
  refreshTable();
  showToast("已清空");
}

function saveAndClear() {
  const selected = allItems.filter(i => i.checked && i.qty > 0);
  if (selected.length === 0) { showToast("请先点+号选择商品"); return; }

  const addr = getAddress();
  let totalPrice = 0;
  const items = selected.map(item => {
    const sub = item.price * item.qty;
    totalPrice += sub;
    return {
      name: item.name, spec: item.spec, unit: item.unit,
      price: item.price, qty: item.qty, subtotal: sub
    };
  });

  // 保存到今日订单
  const orders = loadOrders();
  const order = {
    id: Date.now(),
    time: formatDateTime(),
    address: addr || "（无地址）",
    items: items,
    itemCount: items.length,
    totalQty: items.reduce((s, i) => s + i.qty, 0),
    totalPrice: totalPrice
  };
  orders.unshift(order);
  saveOrders(orders);

  // 清空勾选
  allItems.forEach(i => { i.checked = false; i.qty = 0; });
  refreshTable();
  updateRecordBadge();

  // 更新地址状态
  document.getElementById("addrStatus").textContent = `已保存 ${orders.length} 单`;
  showToast(`已保存！${items.length}种商品，合计¥${totalPrice.toFixed(2)}`);
}

// ============================================================
// 新增商品
// ============================================================
function openAddModal() {
  // 填充分类下拉
  const sel = document.getElementById("addCat");
  sel.innerHTML = "";
  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat.name;
    opt.textContent = cat.name;
    sel.appendChild(opt);
  });
  const optNew = document.createElement("option");
  optNew.value = "__new__";
  optNew.textContent = "+ 新建分类...";
  sel.appendChild(optNew);
  document.getElementById("newCatGroup").style.display = "none";
  document.getElementById("newCatName").value = "";
  document.getElementById("addName").value = "";
  document.getElementById("addSpec").value = "";
  document.getElementById("addUnit").value = "";
  document.getElementById("addPrice").value = "";
  document.getElementById("addModal").classList.add("show");
  document.getElementById("addName").focus();
}

function closeAddModal() {
  document.getElementById("addModal").classList.remove("show");
}

function onCatChange() {
  const v = document.getElementById("addCat").value;
  document.getElementById("newCatGroup").style.display = v === "__new__" ? "block" : "none";
}

function confirmAdd() {
  const name = document.getElementById("addName").value.trim();
  if (!name) { showToast("请输入商品名称"); return; }
  const priceRaw = document.getElementById("addPrice").value.trim();
  if (!priceRaw) { showToast("请输入单价"); return; }
  const price = parseFloat(priceRaw);
  if (isNaN(price) || price < 0) { showToast("单价请输入有效数字"); return; }

  let catName;
  const catVal = document.getElementById("addCat").value;
  if (catVal === "__new__") {
    catName = document.getElementById("newCatName").value.trim();
    if (!catName) { showToast("请输入新分类名称"); return; }
  } else {
    catName = catVal;
  }

  const spec = document.getElementById("addSpec").value.trim();
  const unit = document.getElementById("addUnit").value.trim() || "件";

  // 加入数据结构
  let cat = categories.find(c => c.name === catName);
  if (!cat) { cat = { name: catName, products: [] }; categories.push(cat); }
  cat.products.push({ name, spec, unit, price, cost: parseFloat(document.getElementById("addCost")?.value || 0) });

  // 加入扁平列表
  allItems.push({ cat: catName, name, spec, unit, price, cost: parseFloat(document.getElementById("addCost")?.value || 0), qty: 0, checked: false });

  // 保存
  saveData();

  // 刷新界面，切到新分类
  currentCat = catName;
  rebuildCatList();
  refreshTable();

  closeAddModal();
  showToast(`已添加: ${name}`);
}

// ============================================================
// 删除商品
// ============================================================
function deleteProduct(item) {
  if (!confirm(`确定要删除商品「${item.name}」吗？\n此操作不可撤销。`)) return;

  // 从 allItems 删除
  const idx = allItems.indexOf(item);
  if (idx >= 0) allItems.splice(idx, 1);

  // 从 categories 删除
  categories.forEach(cat => {
    if (cat.name === item.cat) {
      cat.products = cat.products.filter(p =>
        !(p.name === item.name && p.spec === item.spec && p.unit === item.unit && parseFloat(p.price) === item.price)
      );
    }
  });
  // 删除空分类
  categories = categories.filter(c => c.products.length > 0);

  // 保存 & 刷新
  saveData();
  rebuildCatList();
  refreshTable();
  showToast(`已删除: ${item.name}`);
}

// ============================================================
// 导出 CSV
// ============================================================
function exportCSV() {
  const selected = allItems.filter(i => i.checked && i.qty > 0);
  if (selected.length === 0) { showToast("请先勾选商品并输入数量"); return; }

  const now = formatDateTime();
  const addr = getAddress();
  let csv = `\uFEFF${shopName}\n日期: ${now}\n`;
  if (addr) csv += `收货地址: ${csvEsc(addr)}\n`;
  csv += `\n分类,商品名称,规格,单位,单价,数量,小计\n`;
  let total = 0;
  selected.forEach(item => {
    const sub = item.price * item.qty;
    total += sub;
    csv += `${csvEsc(item.cat)},${csvEsc(item.name)},${csvEsc(item.spec)},${csvEsc(item.unit)},${item.price.toFixed(2)},${item.qty},${sub.toFixed(2)}\n`;
  });
  csv += `\n,,,,,合计,${total.toFixed(2)}\n`;

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `看货清单_${now.replace(/[\/: ]/g, "")}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("CSV已导出");
}

function csvEsc(s) {
  s = String(s);
  if (s.includes(",") || s.includes('"') || s.includes("\n")) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

// 打印清单

function printList() {

  let rows = "";
  let total = 0;
  selected.forEach(item => {
    const sub = item.price * item.qty;
    total += sub;
    rows += `<tr>
      <td>${escHtml(item.cat)}</td>
      <td class="name">${escHtml(item.name)}</td>
      <td>${escHtml(item.spec)}</td>

// ============================================================
const SPLIT_CATS = ["咖啡大炮咖啡豆", "风味糖浆"]; // 需要拆分独立发货单的分类
let splitPriceMode = "sell"; // "sell" = 市售价, "cost" = 成本价

function openSplitModal(mode) {
  const selected = allItems.filter(i => i.checked && i.qty > 0);
  if (selected.length === 0) {
    showToast("请先点+号选择商品");
    return;
  }
  splitPriceMode = mode === "cost" ? "cost" : "sell";
  renderSplitModal();
  document.getElementById("splitModal").classList.add("show");
  // 发货版：自动保存订单记录
  if (mode === "cost") {
    autoSaveOrderFromSplit(selected);
  }
  // 自动展开所有卡片
  setTimeout(() => {
    document.querySelectorAll(".split-card").forEach(c => c.classList.add("open"));
  }, 50);
}

function autoSaveOrderFromSplit(selected) {
  const addr = getAddress();
  if (!addr) return; // 没地址不保存

  let totalPrice = 0;
  const items = selected.map(item => {
    const unitPrice = item.cost || item.price;
    const sub = unitPrice * item.qty;
    totalPrice += sub;
    return {
      name: item.name,
      spec: item.spec,
      unit: item.unit,
      price: unitPrice,
      qty: item.qty,
      subtotal: sub
    };
  });

  const orders = loadOrders();
  const order = {
    id: Date.now(),
    time: formatDateTime(),
    address: addr + " [发货版]",
    items: items,
    itemCount: items.length,
    totalQty: items.reduce((s, i) => s + i.qty, 0),
    totalPrice: totalPrice
  };
  orders.unshift(order);
  saveOrders(orders);
  updateRecordBadge();
}

function closeSplitModal() {
  document.getElementById("splitModal").classList.remove("show");
}

function renderSplitModal() {
  const selected = allItems.filter(i => i.checked && i.qty > 0);
  const container = document.getElementById("splitContent");

  // 按分类分组
  const groups = {};
  selected.forEach(item => {
    if (!groups[item.cat]) groups[item.cat] = [];
    groups[item.cat].push(item);
  });

  // 分离：独立发货单分类 + 其他分类
  const splitCats = SPLIT_CATS.filter(c => groups[c]);
  const otherCats = Object.keys(groups).filter(c => !SPLIT_CATS.includes(c));

  if (selected.length === 0) {
    container.innerHTML = '<div class="split-empty">暂无已选商品</div>';
    return;
  }

  const isCost = splitPriceMode === "cost";
  const title = isCost ? "📦 发货版发货单" : "📋 客户版发货单";
  const priceLabel = isCost ? "成本价¥" : "单价¥";

  let html = `<div style="margin-bottom:12px; font-size:16px; font-weight:bold; color:${isCost ? '#e74c3c' : '#6d4c41'};">${title}</div>`;

  // 独立发货单分类
  splitCats.forEach(catName => {
    html += buildSplitCard(catName, groups[catName], isCost, priceLabel);
  });

  // 其他分类合并为一个"其他商品"发货单
  if (otherCats.length > 0) {
    const otherItems = [];
    otherCats.forEach(c => otherItems.push(...groups[c]));
    html += buildSplitCard("其他商品", otherItems, isCost, priceLabel);
  }

  container.innerHTML = html;
}

function buildSplitCard(catName, items, isCost, priceLabel) {
  let total = 0;
  let totalQty = 0;
  let rows = "";
  items.forEach(item => {
    const unitPrice = isCost ? item.cost : item.price;
    const sub = unitPrice * item.qty;
    total += sub;
    totalQty += item.qty;
    rows += `<tr>
      <td class="name">${escHtml(item.name)}</td>
      <td>${escHtml(item.spec)}</td>
      <td>${escHtml(item.unit)}</td>
      <td class="num">${unitPrice.toFixed(2)}</td>
      <td class="num">${item.qty}</td>
      <td class="num">${sub.toFixed(2)}</td>
    </tr>`;
  });

  const cardId = "split_" + catName.replace(/[^a-zA-Z\u4e00-\u9fa5]/g, "");
  const headerColor = isCost ? "#e74c3c" : "#6d4c41";

  return `<div class="split-card" id="${cardId}">
    <div class="split-header" onclick="toggleSplitCard('${cardId}')" style="background:${isCost ? '#fce4ec' : '#f5ebe0'};">
      <h3 style="color:${headerColor};">${escHtml(catName)}</h3>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="split-info">${items.length}种 / ${totalQty}件 / ¥${total.toFixed(2)}</span>
        <span class="split-toggle">▼</span>
      </div>
    </div>
    <div class="split-body">
      <table class="split-table">
        <thead><tr><th>商品名称</th><th>规格</th><th>单位</th><th>${priceLabel}</th><th>数量</th><th>小计¥</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="5" style="text-align:right; font-weight:bold;">合计</td><td class="num" style="font-weight:bold;">¥${total.toFixed(2)}</td></tr></tfoot>
      </table>
      <div class="split-actions">
        <button class="btn btn-primary" onclick="copySplit('${escAttr(catName)}')">复制此发货单</button>
        <button class="btn btn-info" onclick="exportSplitCSV('${escAttr(catName)}')">导出CSV</button>
        <button class="btn btn-warning" onclick="printSplit('${escAttr(catName)}')">打印</button>
      </div>
    </div>
  </div>`;
}

function toggleSplitCard(id) {
  const card = document.getElementById(id);
  if (card) card.classList.toggle("open");
}

function getSplitItems(catName) {
  const selected = allItems.filter(i => i.checked && i.qty > 0);
  if (catName === "其他商品") {
    return selected.filter(i => !SPLIT_CATS.includes(i.cat));
  }
  return selected.filter(i => i.cat === catName);
}

function copySplit(catName) {
  const items = getSplitItems(catName);
  if (items.length === 0) { showToast("该分类无已选商品"); return; }

  const isCost = splitPriceMode === "cost";
  const tag = isCost ? "发货版" : "客户版";
  const addr = getAddress();
  let lines = [];
  if (addr) lines.push(`地址：${addr}`, "");
  let total = 0;
  items.forEach(item => {
    const unitPrice = isCost ? item.cost : item.price;
    const sub = unitPrice * item.qty;
    total += sub;
    if (isCost) {
      lines.push(`${item.name} ×${item.qty}`);
    } else {
      lines.push(`${item.name} ×${item.qty} ¥${sub.toFixed(2)}`);
    }
  });
  lines.push("", `总价：¥${total.toFixed(2)}`);
  const text = lines.join("\n");

  navigator.clipboard.writeText(text).then(() => {
    showToast(`${catName}${tag}已复制`);
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showToast(`${catName}${tag}已复制`);
  });
}

function exportSplitCSV(catName) {
  const items = getSplitItems(catName);
  if (items.length === 0) { showToast("该分类无已选商品"); return; }

  const isCost = splitPriceMode === "cost";
  const tag = isCost ? "发货版" : "客户版";
  const priceCol = isCost ? "成本价" : "单价";
  const now = formatDateTime();
  const addr = getAddress();
  let csv = `\uFEFF${shopName} - ${catName} ${tag}\n日期: ${now}\n`;
  if (addr) csv += `收货地址: ${csvEsc(addr)}\n`;
  csv += `\n商品名称,规格,单位,${priceCol},数量,小计\n`;
  let total = 0;
  items.forEach(item => {
    const unitPrice = isCost ? item.cost : item.price;
    const sub = unitPrice * item.qty;
    total += sub;
    csv += `${csvEsc(item.name)},${csvEsc(item.spec)},${csvEsc(item.unit)},${unitPrice.toFixed(2)},${item.qty},${sub.toFixed(2)}\n`;
  });
  csv += `\n,,,合计,,${total.toFixed(2)}\n`;

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${catName}_${tag}_${now.replace(/[\/: ]/g, "")}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`${catName} ${tag} CSV已导出`);
}

function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function formatDateTime() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

const ORDER_KEY = "kanhuo_orders";
const ORDER_DATE_KEY = "kanhuo_orders_date";

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function loadOrders() {
  const date = localStorage.getItem(ORDER_DATE_KEY);
  const today = getTodayStr();
  if (date !== today) {
    localStorage.setItem(ORDER_DATE_KEY, today);
    localStorage.setItem(ORDER_KEY, JSON.stringify([]));
    return [];
  }
  try { return JSON.parse(localStorage.getItem(ORDER_KEY) || "[]"); } catch(e) { return []; }
}

function saveOrders(orders) {
  localStorage.setItem(ORDER_KEY, JSON.stringify(orders));
  localStorage.setItem(ORDER_DATE_KEY, getTodayStr());
}

function confirmAddress() {
  const addr = getAddress();
  if (!addr) { showToast("请先输入收货地址"); return; }

  const selected = allItems.filter(i => i.checked && i.qty > 0);
  if (selected.length === 0) { showToast("请先勾选商品并输入数量"); return; }

  // 计算总价
  let totalPrice = 0;
  const items = selected.map(item => {
    const sub = item.price * item.qty;
    totalPrice += sub;
    return {
      name: item.name,
      spec: item.spec,
      unit: item.unit,
      price: item.price,
      qty: item.qty,
      subtotal: sub
    };
  });

  // 保存订单
  const orders = loadOrders();
  const order = {
    id: Date.now(),
    time: formatDateTime(),
    address: addr,
    items: items,
    itemCount: items.length,
    totalQty: items.reduce((s, i) => s + i.qty, 0),
    totalPrice: totalPrice
  };
  orders.unshift(order); // 最新的在前面
  saveOrders(orders);

  // 清空勾选
  allItems.forEach(i => { i.checked = false; i.qty = 0; });
  refreshTable();
  updateRecordBadge();

  // 更新地址状态
  document.getElementById("addrStatus").textContent = `已确认 ${orders.length} 单`;
  showToast(`订单已保存！${items.length}种商品，合计¥${totalPrice.toFixed(2)}`);
}

// 键盘快捷键
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    const panel = document.getElementById("recordPanel");
    if (panel && panel.style.display === "block") {
      panel.style.display = "none";
      return;
    }
    closeAddModal();
    closeSplitModal();
  }
  if (e.key === "Enter" && document.getElementById("addModal").classList.contains("show")) {
    if (e.target.tagName !== "TEXTAREA") confirmAdd();
  }
});
</script>

<!-- 今日导出清单面板 -->
<div class="record-panel" id="recordPanel"></div>
